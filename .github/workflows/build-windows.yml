# Claude edition build: tests on Linux, then FRIDAY.exe + FRIDAY-voice.exe (PyInstaller) and the Inno Setup installer
# on a Windows runner. Output = a workflow artifact only (no release). No secrets: the API key is entered by the owner
# in FRIDAY's first-run window. Models are fetched from their public sources at build time.
name: build-windows

on:
  push:
    branches: [feat/claude-edition]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - name: pytest
        run: python -m pytest -q tests
      - name: module selftests (portable ones)
        run: |
          for m in brain rules categories sessions tasks reminders journal memory workspace documents computer; do
            PYTHONPATH=app python app/$m.py | tail -1
          done

  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 90
    # The repo name ends with a dot ("F.R.I.D.A.Y."): Windows drops trailing dots from folder names, so the default
    # workspace D:\a\F.R.I.D.A.Y.\F.R.I.D.A.Y. can never exist and actions/checkout fails. Build in D:\friday instead.
    defaults:
      run:
        working-directory: D:\friday
    steps:
      - name: checkout (into D:\friday)
        working-directory: D:\
        run: |
          $PSNativeCommandUseErrorActionPreference = $true  # stop at the first failing command
          git init friday
          git -C friday remote add origin https://github.com/${{ github.repository }}.git
          git -C friday fetch --depth 1 origin ${{ github.sha }}
          git -C friday checkout --quiet FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: venv for FRIDAY.exe
        run: |
          $PSNativeCommandUseErrorActionPreference = $true  # stop at the first failing command
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\pip install -r requirements-windows.txt
          .venv\Scripts\pip freeze > pip-freeze-friday.txt
      - name: venv for FRIDAY-voice.exe (Piper)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true  # stop at the first failing command
          python -m venv .venv-tts
          .venv-tts\Scripts\python -m pip install --upgrade pip
          .venv-tts\Scripts\pip install piper-tts onnxruntime "numpy<2" pyinstaller
          .venv-tts\Scripts\pip freeze > pip-freeze-voice.txt
      - name: PyInstaller
        run: |
          $PSNativeCommandUseErrorActionPreference = $true  # stop at the first failing command
          .venv\Scripts\pyinstaller friday.spec --noconfirm
          .venv-tts\Scripts\pyinstaller voice.spec --noconfirm
      - name: import check (every module FRIDAY.exe loads)
        shell: pwsh
        run: |
          # A hidden import PyInstaller missed only fails on the owner's PC (soundfile, 2026-11-19): import them all here.
          New-Item -ItemType Directory -Force D:\friday-root\config | Out-Null
          $env:FRIDAY_ROOT = "D:\friday-root"
          $p = Start-Process dist\FRIDAY\FRIDAY.exe -ArgumentList "--import-check", "D:\friday\import-check.txt" -Wait -PassThru
          Get-Content import-check.txt
          if ($p.ExitCode -ne 0) { Write-Error "import check failed (exit $($p.ExitCode))"; exit 1 }
      - name: size report (what the installer carries)
        shell: pwsh
        run: |
          $rows = foreach ($root in @("dist/FRIDAY/_internal", "dist/FRIDAY-voice/_internal")) {
            Get-ChildItem $root -Force | ForEach-Object {
              $bytes = if ($_.PSIsContainer) { (Get-ChildItem $_.FullName -Recurse -File -Force | Measure-Object Length -Sum).Sum } else { $_.Length }
              [pscustomobject]@{ MB = [math]::Round($bytes / 1MB, 1); Path = "$root/$($_.Name)" }
            }
          }
          $rows | Sort-Object MB -Descending | Select-Object -First 60 | Format-Table -AutoSize | Out-String -Width 200 | Tee-Object size-report.txt
          "TOTAL dist/FRIDAY MB: {0:N1}" -f ((Get-ChildItem dist/FRIDAY -Recurse -File | Measure-Object Length -Sum).Sum / 1MB) | Tee-Object -Append size-report.txt
          "TOTAL dist/FRIDAY-voice MB: {0:N1}" -f ((Get-ChildItem dist/FRIDAY-voice -Recurse -File | Measure-Object Length -Sum).Sum / 1MB) | Tee-Object -Append size-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: size-report-${{ github.sha }}
          path: |
            D:/friday/size-report.txt
            D:/friday/import-check.txt
          retention-days: 14
      - name: Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $thai = "${env:ProgramFiles(x86)}\Inno Setup 6\Languages\Thai.isl"
          if (-not (Test-Path $thai)) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Thai.isl" -OutFile $thai
          }
          $env:ISCC = $iscc
          .venv\Scripts\python installer\build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-claude-edition-${{ github.sha }}
          path: |
            D:/friday/dist/installer/*
            D:/friday/pip-freeze-*.txt
          retention-days: 14
          if-no-files-found: error
